[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analisador-sintatico-lalg"
version = "1.0.0"
description = "Analisador sintático descendente recursivo para LALG."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Projeto de Compiladores" }]

[project.scripts]
lalg-sintatico = "lalg_sintatico.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
