[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compiladores-lalg"
version = "1.0.0"
description = "Analisador léxico e sintático para uma linguagem LALG/Pascal-like."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Projeto de Compiladores" }]

[project.scripts]
lalg = "lalg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
